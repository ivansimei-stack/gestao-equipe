{# barra de progresso com marcador do esperado; espera: prog, esperado, st (status) #}
{% set cor = status_nomes[st][1] %}
<div class="barra-okr" title="Progresso {{ prog|pct }} · esperado {{ esperado|pct }}">
  <div class="barra {{ cor }}"><span style="width:{{ (prog * 100)|round(1) }}%"></span></div>
  {% if 0 < esperado < 1 %}<i class="esperado" style="left:{{ (esperado * 100)|round(1) }}%"></i>{% endif %}
</div>
