<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}{{ APP_NOME }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="marca" href="/">{{ APP_NOME }}</a>
    <nav>
      {% for f in FERRAMENTAS %}
      <a href="/{{ f.slug }}" class="{{ 'ativo' if request.url.path.startswith('/' ~ f.slug) }}">{{ f.nome }}</a>
      {% endfor %}
      <a href="/docs">API</a>
    </nav>
  </header>
  <main>
    {% if request.query_params.get('msg') %}<div class="flash ok">{{ request.query_params.get('msg') }}</div>{% endif %}
    {% if request.query_params.get('erro') %}<div class="flash erro">{{ request.query_params.get('erro') }}</div>{% endif %}
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
